<!--
  NeuBench favicon – the "E" letter from the wordmark.
  Three coloured bars (blue / violet / teal) with transparent background,
  matching the inline SVG used by the NeubenchLogo component and the loading spinner.
-->
<svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue bar (top) -->
  <rect x="10" y="12" width="44" height="9" rx="4.5" fill="#4777FF"/>
  <!-- Violet bar (middle) -->
  <rect x="10" y="27" width="44" height="9" rx="4.5" fill="#8055F5"/>
  <!-- Teal bar (bottom) -->
  <rect x="10" y="42" width="44" height="9" rx="4.5" fill="#13DCCB"/>
</svg>
