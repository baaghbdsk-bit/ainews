name: Refresh benchmark catalogue

# Regenerates src/lib/benchmarks/data.ts from the live OpenRouter catalogue and
# the published BenchLM leaderboards, then opens a pull request with the diff.
#
# Why a PR and not a direct commit: the catalogue is generated data, so a
# human should see what changed (new models, moved scores) before it ships.
# The reviewer merges it, which triggers a normal Vercel deploy.
#
# The catalogue file records its own snapshot date, and
# tests/benchmarks.mjs fails when the catalogue is older than 30 days, so a
# broken or skipped refresh is caught in CI rather than going unnoticed.
#
# No secrets are required: the script reads public endpoints only, and the
# pull request is opened with GitHub's built-in token.

on:
  schedule:
    # 06:17 UTC daily. Off the hour so this does not pile onto the same
    # GitHub Actions minute as every other scheduled job.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-benchmark-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Regenerate the catalogue
        run: node scripts/fetch-models.mjs --refresh

      - name: Verify the regenerated catalogue
        run: |
          if git diff --quiet -- src/lib/benchmarks/data.ts; then
            echo "Catalogue is already current - nothing to propose."
            exit 0
          fi
          echo "Catalogue changed:"
          git diff --stat -- src/lib/benchmarks/data.ts

      - name: Verify the new catalogue still passes the suite
        run: node --experimental-strip-types tests/benchmarks.mjs

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-benchmark-catalogue
          title: "chore: refresh benchmark catalogue"
          commit-message: "chore: refresh benchmark catalogue"
          body: |
            Automated refresh of `src/lib/benchmarks/data.ts` from the live
            OpenRouter catalogue and the published BenchLM leaderboards.

            - Newest model in the catalogue: see the diff
            - Sources: OpenRouter public catalogue + BenchLM leaderboards
            - Generated by `scripts/fetch-models.mjs --refresh`

            The benchmark test suite ran against the new catalogue as part of
            this job and passed.
          labels: |
            dependencies
            automated
          delete-branch: true
