name: Ingest AI news (hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Full ingest
        run: node --experimental-strip-types scripts/ingest.mjs full
      - name: Enrich backlog
        run: |
          for i in $(seq 1 12); do
            out=$(node --experimental-strip-types scripts/ingest.mjs enrich)
            echo "$out"
            remaining=$(echo "$out" | jq -r '.remaining // 0')
            [[ -z "$remaining" || "$remaining" == "0" ]] && break
          done
      - name: Summarize backlog
        run: |
          for i in $(seq 1 12); do
            out=$(node --experimental-strip-types scripts/ingest.mjs summarize)
            echo "$out"
            sr=$(echo "$out" | jq -r '.summaryRemaining // 0')
            [[ "$sr" == "0" ]] && break
          done
      - name: Images backlog
        run: |
          for i in $(seq 1 6); do
            out=$(node --experimental-strip-types scripts/ingest.mjs images)
            echo "$out"
            ir=$(echo "$out" | jq -r '.imagesRemaining // 0')
            [[ "$ir" == "0" ]] && break
          done
