name: Ingest AI news (every 30 minutes)

# Fires every 30 minutes and pushes the latest RSS feeds into Supabase, extracts
# article bodies, generates reader-facing summaries, then revalidates the
# timeline. Runs on the free tier; summaries use an LLM only if the *deployment*
# has LLM_API_KEY set (otherwise a zero-cost extractive fallback is used).
#
# Secrets required in GitHub -> Settings -> Secrets and variables -> Actions:
#   CRON_SECRET              - bearer token the route checks (any long random string)
#   NEXT_PUBLIC_SUPABASE_URL - your Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY - server key (bypasses RLS so the job can INSERT)
#   INGEST_URL               - publicly reachable URL of this app, e.g.
#                              https://<project>.vercel.app
#
# Note: the ingest job executes inside the deployed app, so LLM_API_KEY (if
# used) must be set in the *host* environment (e.g. Vercel project settings),
# not here.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGEST_URL: ${{ secrets.INGEST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run ingestion job
        run: |
          if [ -z "$INGEST_URL" ]; then
            echo "INGEST_URL is not set. Set it to your deployed app URL in Secrets."
            exit 1
          fi

          echo "== Full ingest (fetch feeds + insert + enrich) =="
          curl -fsS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$INGEST_URL/api/cron/ingest" | tee /tmp/ingest.json
          echo

          # Each call only enriches a bounded batch (see INGEST_ENRICH_LIMIT), so
          # keep calling the cheap enrich-only mode until the backlog is drained.
          remaining=$(jq -r '.remaining // 0' /tmp/ingest.json 2>/dev/null || echo 0)
          for i in $(seq 1 12); do
            if [ -z "$remaining" ] || [ "$remaining" = "0" ]; then
              break
            fi
            echo "== Enrich pass $i (remaining: $remaining) =="
            curl -fsS \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$INGEST_URL/api/cron/ingest?mode=enrich" | tee /tmp/ingest.json
            echo
            remaining=$(jq -r '.remaining // 0' /tmp/ingest.json 2>/dev/null || echo 0)
            rate_limited=$(jq -r '.rateLimited // false' /tmp/ingest.json 2>/dev/null || echo false)
            enriched=$(jq -r '.enriched // 0' /tmp/ingest.json 2>/dev/null || echo 0)
            if [ "$rate_limited" = "true" ] && [ "$enriched" = "0" ]; then
              echo "A source is throttling us (HTTP 429); stopping early to retry next run."
              break
            fi
          done

          # Generate reader-facing summaries (LLM when the deployment has an
          # LLM_API_KEY, else the extractive fallback). Each call handles a
          # bounded batch, so keep calling until the backlog is drained.
          summary_remaining=1
          for i in $(seq 1 12); do
            echo "== Summarize pass $i =="
            curl -fsS \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$INGEST_URL/api/cron/ingest?mode=summarize" | tee /tmp/ingest.json
            echo
            summary_remaining=$(jq -r '.summaryRemaining // 0' /tmp/ingest.json 2>/dev/null || echo 0)
            if [ "$summary_remaining" = "0" ]; then
              break
            fi
          done

          # Fill lead images for rows that still have none: the feed item's own
          # image when it has one, otherwise the source page's og:image. Each
          # call handles a bounded batch, so keep calling until it is drained.
          images_remaining=1
          for i in $(seq 1 6); do
            echo "== Images pass $i (remaining: $images_remaining) =="
            curl -fsS \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$INGEST_URL/api/cron/ingest?mode=images&imagesLimit=40" | tee /tmp/ingest.json
            echo
            images_remaining=$(jq -r '.imagesRemaining // 0' /tmp/ingest.json 2>/dev/null || echo 0)
            images_filled=$(jq -r '.imagesFilled // 0' /tmp/ingest.json 2>/dev/null || echo 0)
            if [ "$images_remaining" = "0" ] || [ "$images_filled" = "0" ]; then
              break
            fi
          done
