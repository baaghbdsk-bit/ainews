name: Migrate database

# Applies new files in supabase/migrations/ whenever they change on main, so
# schema changes ship with the code without anyone touching the SQL Editor.
#
# Requires one repository secret:
#   DATABASE_URL - Supabase connection string (Project Settings -> Database).
#                  Use the "Session pooler" or "Direct connection" URI.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/migrate.mjs'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            echo "::error::Use the Session pooler URI (Project Settings -> Database -> Connection string -> Session pooler)."
            exit 1
          fi
          # The "Direct connection" URI resolves to the project's IPv6 address,
          # which GitHub-hosted runners cannot reach (ENETUNREACH). The session
          # pooler is IPv4 and works from any runner. Detect the direct URI and
          # say so plainly instead of surfacing a socket error.
          if echo "$DATABASE_URL" | grep -qE '@(db|[a-z0-9]+\.pooler)\.supabase\.(co|com)'; then
            echo "::error::DATABASE_URL points at the Supabase direct connection (IPv6-only)."
            echo "::error::GitHub runners cannot reach the project's IPv6 address."
            echo "::error::Switch the secret to the Session pooler URI: Project Settings -> Database -> Connection string -> Session pooler."
            exit 1
          fi
          node scripts/migrate.mjs
